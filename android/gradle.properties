# Mémoire adaptée à un PC de 8 Go de RAM : l'ancien réglage (-Xmx8G + 4G de
# métaspace) faisait planter Gradle par manque de mémoire (hs_err_pid*.log).
# jdk.net.unixdomain.tmpdir : le TEMP au chemin court (BORISN~1) fait échouer
# les sockets locaux de Java ("Unable to establish loopback connection").
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:/tmp/jdk-unix
org.gradle.workers.max=2
# Compile Kotlin dans le processus Gradle au lieu d'un démon séparé (une JVM de moins).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
