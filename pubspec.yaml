name: shopnotbook
description: "ShopBook - carnet du boutiquier : stock, entrées/sorties, inventaire (CUMP), bénéfices."
publish_to: 'none'

version: 4.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi_web: any
  sqlite3: ^2.7.0
  path: ^1.9.0
  intl: any
  pdf: ^3.11.0
  printing: ^5.13.0
  provider: ^6.1.2
  crypto: ^3.0.6
  fl_chart: any
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  cryptography: ^2.9.0
  sqflite_common_ffi: any
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Police embarquée dans les PDF (accents, Œ, —, → : la police PDF standard ne les a pas).
  assets:
    - assets/fonts/
