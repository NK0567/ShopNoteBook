publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi_web: any
  sqlite3: ^2.7.0
  path: ^1.9.0
  intl: any
  pdf: ^3.11.0
  printing: ^5.13.0
  provider: ^6.1.2
  crypto: ^3.0.6
  fl_chart: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: any
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
